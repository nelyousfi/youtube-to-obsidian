<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube to Obsidian - Settings</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        margin: 0;
        padding: 24px;
        min-width: 340px;
        background: #f7f7f8;
        color: #1f1f23;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1e1e20;
          color: #e8e8ea;
        }
      }
      h1 {
        font-size: 18px;
        margin: 0 0 16px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin: 16px 0 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        font-size: 14px;
        border: 1px solid #c7c7cc;
        border-radius: 8px;
        background: #fff;
        color: inherit;
      }
      @media (prefers-color-scheme: dark) {
        input {
          background: #2c2c2e;
          border-color: #48484a;
        }
      }
      .hint {
        font-size: 12px;
        color: #6e6e73;
        margin-top: 4px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 20px;
        align-items: center;
      }
      button {
        padding: 9px 16px;
        font-size: 14px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      #save {
        background: #7c5cf2;
        color: #fff;
      }
      #test {
        background: transparent;
        color: #7c5cf2;
        border: 1px solid #7c5cf2;
      }
      #status {
        font-size: 13px;
        margin-top: 12px;
        min-height: 18px;
      }
      #status.ok {
        color: #2ba640;
      }
      #status.err {
        color: #ff4e45;
      }
    </style>
  </head>
  <body>
    <h1>YouTube to Obsidian</h1>

    <label for="apiKey">API key</label>
    <input
      type="password"
      id="apiKey"
      placeholder="Paste the key from Obsidian -> Local REST API settings"
      autocomplete="off"
    />

    <label for="baseUrl">Server URL</label>
    <input type="text" id="baseUrl" placeholder="http://127.0.0.1:27123" />

    <label for="vaultPath">Vault path</label>
    <input
      type="text"
      id="vaultPath"
      placeholder="/Users/you/Documents/Obsidian/Vault"
    />
    <div class="hint">Full filesystem path to your vault (used to open notes).</div>

    <label for="talksFolder">Talks folder</label>
    <input type="text" id="talksFolder" placeholder="talks" />
    <div class="hint">Folder (relative to the vault) for talk notes.</div>

    <label for="template">Note template</label>
    <input
      type="text"
      id="template"
      placeholder="Templates/Talk Template.md"
    />
    <div class="hint">Template (relative to the vault) with a "video" frontmatter property.</div>

    <div class="row">
      <button id="save">Save</button>
      <button id="test">Test connection</button>
    </div>

    <div id="status"></div>

    <script src="options.js"></script>
  </body>
</html>
