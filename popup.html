<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube to Obsidian</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        margin: 0;
        padding: 0;
        width: 360px;
        background: #f7f7f8;
        color: #1f1f23;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1e1e20;
          color: #e8e8ea;
        }
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-bottom: 1px solid rgba(128, 128, 128, 0.2);
      }
      header .app {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 700;
      }
      header .app .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #7c5cf2;
      }
      #settings {
        background: rgba(128, 128, 128, 0.12);
        border: none;
        cursor: pointer;
        font-size: 20px;
        line-height: 1;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        color: inherit;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #settings:hover {
        background: rgba(128, 128, 128, 0.24);
      }
      .body {
        padding: 16px;
      }
      #state {
        font-size: 13px;
        color: #6e6e73;
        padding: 20px 0;
        text-align: center;
      }
      .preview {
        display: none;
      }
      .preview.visible {
        display: block;
      }
      .field {
        margin-bottom: 12px;
      }
      .label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: #6e6e73;
        margin-bottom: 4px;
      }
      .value {
        font-size: 13px;
        line-height: 1.35;
        word-break: break-word;
      }
      .value.title {
        font-weight: 600;
        font-size: 14px;
      }
      .value.channel {
        display: inline-block;
        background: rgba(124, 92, 242, 0.15);
        color: #7c5cf2;
        padding: 2px 8px;
        border-radius: 6px;
      }
      .value.url {
        color: #6e6e73;
        font-size: 12px;
      }
      #add-note {
        width: 100%;
        padding: 11px;
        font-size: 14px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        background: #7c5cf2;
        color: #fff;
        cursor: pointer;
        margin-top: 4px;
      }
      #add-note:hover {
        background: #6a48e0;
      }
      #add-note:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #status {
        font-size: 13px;
        margin-top: 12px;
        min-height: 18px;
        text-align: center;
      }
      #status.ok {
        color: #2ba640;
      }
      #status.err {
        color: #d32f2f;
      }
      #open-note {
        display: none;
        margin-top: 12px;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
        color: #7c5cf2;
        text-decoration: none;
      }
      #open-note:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="app"><span class="dot"></span>YouTube to Obsidian</div>
      <button id="settings" title="Settings">&#9881;</button>
    </header>
    <div class="body">
      <div id="state">Loading...</div>

      <div id="preview" class="preview">
        <div class="field">
          <div class="label">Title</div>
          <div id="video-title" class="value title"></div>
        </div>
        <div class="field">
          <div class="label">Channel (subfolder)</div>
          <div id="video-channel" class="value channel"></div>
        </div>
        <div class="field">
          <div class="label">URL</div>
          <div id="video-url" class="value url"></div>
        </div>
        <button id="add-note">Add note</button>
      </div>

      <div id="status"></div>
      <a id="open-note" href="#" target="_blank" rel="noopener">Open note in Obsidian &rarr;</a>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
